name: Проверка публичной витрины

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить компиляцию публичного кода
        run: python -m compileall -q cashflow
      - name: Убедиться, что коммерческие файлы отсутствуют
        run: |
          test ! -e main.py
          test ! -e v49.py
          test ! -e cashflow/application.py
          test ! -e cashflow/migrations/legacy.py
